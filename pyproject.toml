[tool.ruff]
# Indique à Ruff la version de Python utilisée pour optimiser ses corrections
target-version = "py313"

# On ajoute le .gitignore aux exclusions par défaut de Ruff sans les écraser
extend-exclude = [
    ".gitignore",
]

# Limite de caractères par ligne 
line-length = 88

# Règles à appliquer :
# E = Erreurs de style (Espaces, sauts de ligne...)
# F = Fautes de logique (Variables non utilisées, erreurs de syntaxe...)
# D = Docstrings (Commentaires des classes et fonctions)
# I = Tri alphabétique des imports
select = ["E", "F", "D", "I"]

# Règles à ignorer (si jamais ruff est trop embêtant sur certaines règles)
ignore = ["E501"]
#E501 correspond à l'erreur de ligne trop longue, les lignes trop longues restantes correspondent 
# à des docstrings

[tool.ruff.lint.pydocstyle]
# Force la vérification des docstrings selon la convention Google
convention = "google"

[tool.ruff.lint.per-file-ignores]
# On ignore les règles de docstrings (D) pour tous les fichiers dans le dossier test/
"test/**/*.py" = ["D"]